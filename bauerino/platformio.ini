[platformio]
default_envs = bauerino480
libdeps_dir = ../../output/bauerino-prep/.pio/libdeps

[env]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
lib_deps = h2zero/NimBLE-Arduino@2.5.1

; Current development board, identified on COM6 on 2026-11-09.
; ESP32-S3 rev 0.2, 16MB quad flash, 8MB embedded octal PSRAM.
; The later Mini target must get its own profile after identification.
[env:esp32s3]
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
upload_port = COM6
monitor_port = COM6
build_flags =
    -std=gnu++17
    -DVIRGIN_EMBEDDED=1
    -DVIRGIN_CORE2=1
    -DVIRGIN_EMBEDDED_HASH_KIB=512
    -DVIRGIN_EMBEDDED_MAX_PLY=20
    -fexceptions
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    ; Current board uses a CH343 USB/UART bridge.
    -DARDUINO_USB_CDC_ON_BOOT=0

; Bauerino target: Waveshare ESP32-S3-Touch-AMOLED-2.16 (native USB).
[env:bauerino480]
custom_mame_no_debug_commands = yes
extra_scripts = post:mame_build.py
board_build.partitions = partitions.csv
extends = env:esp32s3
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
upload_port = COM8
monitor_port = COM8
build_flags =
    -std=gnu++17
    -DVIRGIN_EMBEDDED=1
    -DVIRGIN_CORE2=1
    -DVIRGIN_EMBEDDED_HASH_KIB=512
    -DVIRGIN_EMBEDDED_MAX_PLY=20
    -fexceptions
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBAUERINO_DISPLAY=1
lib_deps =
    ${env.lib_deps}
    moononournation/GFX Library for Arduino@1.6.4
    lewisxhe/SensorLib@0.3.3
