; MAME/MESS-on-ESP32-S3 - Phase-B-Skelett (NICHT der Emulator)
; Zweck: reproduzierbarer Build des Plattformgeruests + Messpunkte fuer
; Firmwaregroesse, statisches RAM, freier Heap und PSRAM.
; Verwendet die bereits vorhandenen PlatformIO-Pakete (framework-espidf,
; toolchain-xtensa-esp32s3). Hardwareprofil vorlaeufig, siehe docs/07.

[platformio]
default_envs = esp32s3-skeleton

; Hinweis zum Buildablauf (wichtig, siehe docs/09 "Build-Erkenntnisse"):
; PlatformIO ruft CMake nur dann wirklich auf, wenn es den Projektstand als
; geaendert ansieht. Aenderungen an einer Komponenten-CMakeLists.txt allein
; loesen das nicht aus - dann bleibt build.ninja veraltet und die Aenderung
; wirkt nicht (Laeufe #9/#10). Zwei Wege fuehren zum Ziel:
;   a) diese Datei mitaendern (loest die Neukonfiguration bei vorhandenem
;      CMakeCache.txt aus -> schnell), oder
;   b) .pio/build/esp32s3-skeleton/CMakeCache.txt loeschen (erzwingt eine
;      vollstaendige Neukonfiguration -> laengerer Build).

[env:esp32s3-skeleton]
; Platform bewusst auf 6.8.1 gepinnt: Diese Version ist lokal VOLLSTAENDIG
; vorhanden (toolchain-xtensa-esp-elf 13.2.0, framework-espidf 3.50300.0,
; tool-cmake 3.16.4, tool-ninja 1.9.0, tool-idf 1.0.1). Die neuere Platform
; 7.0.1 verlangt toolchain-xtensa-esp-elf 15.2.0+20251204, das hier nicht
; gecacht ist und dessen Download in dieser Umgebung nicht durchkommt.
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600

; Vorlaeufiges Entwicklungsprofil: 16 MB Flash + 8 MB PSRAM (OCT)
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults

build_flags =
    -DMAME_S3_SKELETON=1
    ; MAME-0.220-Schalter. Der Waechter in osd/eminline.h heisst MAME_NOASM
    ; (nicht NOASM); mit MAME_NOASM liefert eminline.h die Rechenfunktionen als
    ; C++-Inlines.
    ; KEIN -DPTR64=0! MAMEs validity.cpp prueft per "#ifdef PTR64", also nur das
    ; Vorhandensein des Makros, und verlangt dann sizeof(void*)==8 (Lauf #19:
    ; "static assertion failed: PTR64 flag enabled, but was compiled for 32-bit
    ; target"). MAME selbst setzt PTR64 nur auf 64-Bit-Zielen.
    -DMAME_NOASM=1
    -DLSB_FIRST=1
    ; Preserve a startup logic_error's stack before MAME catches it.
    -Wl,--wrap=__cxa_throw
    ; KEIN -frtti und kein -std=gnu++17 hier! Diese Schalter gelten nur fuer C++;
    ; gcc warnt bei C-Dateien ("valid for C++ but not for C"), und wpa_supplicant
    ; wird in ESP-IDF mit -Werror gebaut -> harter Abbruch (Lauf #11:
    ; "cc1.exe: error: command-line option '-frtti' is valid for C++/D/ObjC++ but
    ; not for C [-Werror]"). RTTI kommt aus CONFIG_COMPILER_CXX_RTTI=y in der
    ; wirksamen sdkconfig, der C++-Standard aus den Schaltern der Komponente.
    ;
    ; EBENSO WICHTIG: hier duerfen KEINE -I-Pfade auf die MAME-Quellen stehen.
    ; Global gesetzte Include-Pfade gelten fuer ALLE Komponenten und verdecken
    ; die eigenen Header des ESP-IDF: wpa_supplicant/src/crypto/crypto_mbedtls.c
    ; bekam so MAMEs src/lib/util/sha1.h -> osdcore.h -> <cstdio> und brach ab
    ; (Lauf #13: "fatal error: cstdio: No such file or directory"). Die Pfade
    ; stehen in components/mame0220/CMakeLists.txt (INCLUDE_DIRS) und kommen dort
    ; nachweislich bei den ausgelagerten MAME-Quellen an.

; Hinweis: Die Zielhardware "Bauer Rigno" ist nicht verifiziert.
; Dieses Profil ist ausdruecklich vorlaeufig.
